name: Docker Image Publish

on: [push, workflow_dispatch]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Create entrypoint.sh dynamically
        run: |
          cat << 'EOF' > entrypoint.sh
          #!/bin/bash
          set -e

          MOUNTED_DIR="/app/Jetelina/app/resources/config"
          TARGET_CONFIG="${MOUNTED_DIR}/JetelinaConfig.cnf"
          TARGET_ONNX="${MOUNTED_DIR}/model_quantized.onnx"
          TEMPLATE_CONFIG="/app/Jetelina/app/resources/template_config/JetelinaConfig.cnf"

          if [ ! -f "$TARGET_CONFIG" ]; then
              echo "[Jetelina] Local configuration not found. Initializing JetelinaConfig.cnf..."
              cp "$TEMPLATE_CONFIG" "$TARGET_CONFIG"
          else
              echo "[Jetelina] Local configuration found. Keeping your existing settings."
          fi

          if [ ! -f "$TARGET_ONNX" ]; then
              echo "[Jetelina] ONNX model not found. Downloading from GitHub Releases (113MB)..."
              DOWNLOAD_URL="https://github.com"
              curl -L "$DOWNLOAD_URL" -o "$TARGET_ONNX"
              echo "[Jetelina] ONNX model downloaded successfully!"
          else
              echo "[Jetelina] ONNX model found locally. Skipping download (Launch time: 0s)."
          fi

          exec "$@"
          EOF
          chmod +x entrypoint.sh

      - name: Create Dockerfile dynamically
        run: |
          cat << 'EOF' > Dockerfile
          # 【バージョン修正】Julia 1.12（v1.12.6含む最新環境）をベースに採用
          FROM julia:1.12-focal

          # 最小限のシステムパッケージ（curlなど）をインストール
          RUN apt-get update && apt-get install -y \
              curl \
              ca-certificates \
              && rm -rf /var/lib/apt/lists/*

          WORKDIR /app

          # リポジトリ内のすべてのファイル（Jetelinaフォルダを含む）をコンテナ内へコピー
          COPY . .

          # 独自サーバーの実行バイナリに実行権限を確実に付与
          RUN chmod +x /app/Jetelina/bin/server

          # 初期設定のJetelinaConfig.cnfをコンテナ内の退避エリアにバックアップ
          RUN mkdir -p /app/Jetelina/app/resources/template_config && \
              cp /app/Jetelina/app/resources/config/JetelinaConfig.cnf /app/Jetelina/app/resources/template_config/JetelinaConfig.cnf

          # 生成したentrypointを内部へ埋め込む
          COPY entrypoint.sh /usr/local/bin/entrypoint.sh
          RUN chmod +x /usr/local/bin/entrypoint.sh

          ENTRYPOINT ["/usr/local/bin/entrypoint.sh"]

          # 指定された本物の起動コマンドを実行（指定されたバージョンのJuliaが裏で連動します）
          CMD ["sh", "-c", "cd /app/Jetelina/bin && exec ./server -l 0.0.0.0"]
          EOF

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/git-jetelina/jetelina:latest
